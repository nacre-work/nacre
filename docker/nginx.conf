# The company admin UI and the API on one origin.
#
# The admin bundle calls the API at `location.origin` (see packages/admin/src/api.ts),
# so serving the UI and proxying `/v1` from the same host is what makes the two
# same-origin — and the API sets no CORS headers deliberately, so same-origin is
# not a convenience here, it is the only arrangement that works without a header
# the API does not send. This is the front `docs/architecture.md` describes,
# built into the stack so the UI has a URL the moment `docker compose up` returns
# rather than after a manual build and a proxy the operator writes themselves.
#
# `/v1` and `/.well-known` are the API; everything else is the static admin. The
# MCP port and `/metrics` are deliberately not proxied — an agent talks to the
# mcp service directly, and metrics are not a thing the admin origin exposes.

server {
    listen 80;
    server_name _;

    # A resolved-once upstream: `api` is a Compose service name, and `depends_on`
    # below means the container exists before nginx starts, so the name resolves
    # at load. Good enough for a single-host stack; a real ingress in front of a
    # cluster is the production shape and is the operator's.
    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The admin is a static bundle with client-side (hash) routing, so any path
    # that is not a file falls back to index.html rather than 404ing.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
