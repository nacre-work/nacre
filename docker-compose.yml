# Nacre — the three deployment profiles from docs/config.md.
#
#   minimal    api, mcp, worker, the migrate job, parser, postgres, qdrant, redis.
#              Embeddings come from an endpoint you name. Runs on a laptop.
#   full       plus minio, an embedder, and a reranker. The typical install.
#   airgapped  everything local, zero outbound traffic, local OIDC.
#
# Services with no `profiles` key belong to every profile — that is how Compose
# works, and it is why the eight unprofiled services (the migrate job and mcp
# among them) are unmarked rather than listed three times.
#
#   docker compose --profile minimal up -d
#
# Nothing here carries a real credential. Values come from .env, and in
# production the secret-bearing ones are references into a secret store; see
# docs/config.md, which also explains why NACRE_PG_URL must not name a
# superuser.

name: nacre

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  # Optional so a fresh clone resolves without copying .env first, and so CI
  # can validate the file. Values still come from .env when it exists, and from
  # the environment otherwise.
  env_file:
    - path: .env
      required: false
  depends_on:
    postgres: { condition: service_healthy }
    qdrant: { condition: service_started }
    redis: { condition: service_healthy }

services:
  # Runs to completion before anything else starts, and is the only service
  # allowed to touch the schema. Without it a fresh `docker compose up` brought
  # the API up against an empty database and the first request failed on a
  # missing table — `pnpm migrate` goes through tsx, which is a development
  # dependency and is not in the runtime image.
  #
  # A separate one-shot rather than a step inside the API: three replicas
  # starting together would each try to migrate, and the ones that lose the race
  # report a failure that is not one.
  migrate:
    <<: *app
    command: ["node", "packages/core/dist/migrate-main.js"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      disable: true

  api:
    <<: *app
    command: ["node", "packages/api/dist/main.js"]
    # The host side is interpolated so a busy port is a one-line .env entry
    # rather than an override file. The container side is fixed: PORT, the
    # probes and every in-network reference agree on it, and none of them care
    # what the host publishes.
    ports: ["${NACRE_API_HOST_PORT:-8080}:8080"]
    environment:
      PORT: 8080
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }
      redis: { condition: service_healthy }

  mcp:
    <<: *app
    command: ["node", "packages/mcp/dist/main.js"]
    ports: ["${NACRE_MCP_HOST_PORT:-8081}:8081"]
    environment:
      PORT: 8081
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }
      redis: { condition: service_healthy }
    # The API's /v1/health does not exist here — this process serves /mcp and
    # nothing else — so the shared HTTP check would report every MCP container
    # unhealthy forever. A TCP connect is what this transport can honestly
    # answer without authenticating.
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:net').connect(Number(process.env.PORT||8081),'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3

  worker:
    <<: *app
    command: ["node", "packages/worker/dist/main.js"]
    # No ports. The worker talks outward only — which also means the image's
    # HTTP healthcheck can never pass here, and a container that is permanently
    # unhealthy is one an orchestrator will restart forever. It has nothing to
    # serve, so it has nothing to check.
    healthcheck:
      disable: true
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }
      redis: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # A superuser, and therefore the one configuration docs/config.md tells
      # operators not to use: row-level security does not apply to a superuser
      # at all, so the tenant-isolation policies are enabled and inert here.
      #
      # Deliberate for a development and pilot distribution, where one role is
      # one less thing to get wrong — and stated rather than left to be
      # discovered, because it is exactly what hid two bugs for months. The
      # application worked only because of this. Anything past a pilot should
      # point NACRE_PG_URL at `nacre_app` (created by migration 0002, given a
      # password by the operator) and leave this role to the migrate service.
      POSTGRES_USER: nacre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nacre}
      POSTGRES_DB: nacre
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nacre -d nacre"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    # Pinned to a version the client in packages/core actually supports.
    #
    # It was v1.15.1 against a `^1.18.0` client, so every process logged
    # "Client version 1.18.0 is incompatible with server version 1.15.1" on
    # startup, forever. A warning that appears on every boot is a warning
    # nobody reads, which is how the one that matters gets missed.
    #
    # CI ran `qdrant/qdrant:latest` at the same time, so the version this file
    # ships was the one version nothing tested against. Both are this now.
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    volumes: ["qdrant:/qdrant/storage"]
    # Not published by default. The vector store holds every embedding in the
    # installation and has no per-tenant authorization of its own — reaching it
    # directly bypasses the entire permission model.
    expose: ["6333"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  parser:
    build:
      context: .
      dockerfile: docker/Dockerfile.parser
    restart: unless-stopped
    expose: ["8090"]

  # ─────────────────────────── full ───────────────────────────

  minio:
    profiles: [full]
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${NACRE_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${NACRE_S3_SECRET_KEY:-minioadmin}
    volumes: ["minio:/data"]
    expose: ["9000"]
    # AGPLv3, which is why it is here and not in minimal. The default is an
    # external S3-compatible endpoint; see docs/licensing.md before making this
    # part of the standard install.

  embedder:
    profiles: [full, airgapped]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-m3"]
    volumes: ["models:/data"]
    expose: ["80"]

  reranker:
    profiles: [full, airgapped]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-reranker-base"]
    volumes: ["models:/data"]
    expose: ["80"]

  # ───────────────────────── airgapped ─────────────────────────

  keycloak:
    profiles: [airgapped]
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:-admin}
    expose: ["8080"]

volumes:
  postgres:
  qdrant:
  redis:
  minio:
  models:
