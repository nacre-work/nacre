# Apple Silicon — an overlay, not a fourth profile.
#
# Select it once, in .env, rather than on every command:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.apple-silicon.yml
#
# then plain `docker compose --profile minimal up -d`. `.env.example` ships that
# line commented out. The two `-f` flags are equivalent and are what this
# comment used to give:
#
#   docker compose -f docker-compose.yml -f docker-compose.apple-silicon.yml \
#     --profile minimal up -d
#
# The flags are worse because they have to be right every time and nothing
# reminds you — a later plain `docker compose up -d` recreates api and worker
# without the extra_hosts below, and the symptom is an EAI_AGAIN in the worker
# arriving long after the command that caused it.
#
# See docs/apple-silicon.md. The short version of why this file is small:
# almost nothing about an M-series Mac is special any more.
#
# Since 0.5.2 `ghcr.io/nacre-work/nacre` and `-parser` are published for
# linux/amd64 **and** linux/arm64, and Postgres, Qdrant, Redis, MinIO and nginx
# have all shipped arm64 for years. So the stack this file overlays is native on
# an M-series Mac with no help from anyone. What is left is the two things that
# are genuinely different, and both are about where embeddings come from.
#
# Compose merges this over docker-compose.yml — every service, port, volume and
# healthcheck there still applies, and only the keys below are added.

name: nacre

services:
  # `host.docker.internal`, made to resolve.
  #
  # On an Apple Silicon Mac the embedder runs on the *host*, natively, against
  # Metal — see the embedder/reranker note below for why. That means the two
  # processes which call it have to be able to reach out of the Compose network
  # to the machine running it.
  #
  # Docker Desktop resolves `host.docker.internal` on its own and this line
  # changes nothing there. Colima, Rancher Desktop, OrbStack and podman do not
  # all agree about that, and the failure when it is missing is an `EAI_AGAIN`
  # in the worker log that says nothing about the cause. One line, and the
  # question stops being which Docker you installed.
  #
  # Deliberately **not** a default for NACRE_DEFAULT_EMBEDDING_ENDPOINT. That
  # variable ships empty and the processes refuse to start without it, which is
  # the "no silent defaults for URLs" rule in docs/config.md; an overlay that
  # quietly filled it in with a host that may have nothing listening would
  # reintroduce exactly the failure the empty default exists to prevent — a
  # stack that comes up healthy, accepts a document, and fails to index it.
  # docs/apple-silicon.md gives the line to paste into .env.
  api:
    extra_hosts: ["host.docker.internal:host-gateway"]

  worker:
    extra_hosts: ["host.docker.internal:host-gateway"]

  # The two services with no arm64 image at all.
  #
  # Text Embeddings Inference publishes linux/amd64 only — checked against the
  # registry for cpu-1.6, cpu-1.7, cpu-1.8 and cpu-latest, and there is no
  # arm64, aarch64 or metal tag. TEI's own answer for Apple Silicon is to build
  # it from source with `--features metal`, which is a toolchain on your laptop
  # and not an image anybody can pull.
  #
  # So on an M-series Mac `--profile full` runs these two under emulation. This
  # states that rather than leaving Docker to infer it: without the key you get
  # the same emulated container plus a warning, and with a Docker runtime that
  # has no emulation configured you get a pull that fails with a manifest error
  # instead of a start that fails with an illegal instruction.
  #
  # Stating the platform is not a claim that it works. Whether an amd64 build
  # compiled with x86 vector instructions runs under Rosetta 2 or QEMU is a
  # question about your Docker runtime, and it is not one this file can answer.
  # The arrangement docs/apple-silicon.md recommends — `minimal`, with a
  # native embedder on the host — avoids the question and is much faster than
  # the emulated answer would be even where it works.
  embedder:
    platform: linux/amd64

  reranker:
    platform: linux/amd64
