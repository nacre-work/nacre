name: build

on:
  push:    { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:unit

  # The public repo must build and test without access to nacre-enterprise.
  # If this job fails, the open/commercial boundary has leaked.
  boundary:
    name: boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core must not reference private packages
        run: |
          set -euo pipefail
          # grep exits 2 when a search path is missing, and `if grep` reads
          # that as "no match" — so a renamed directory would silently turn
          # this check into a no-op. Fail loudly instead.
          for d in packages services; do
            [ -d "$d" ] || { echo "::error::$d/ is missing; boundary check cannot run"; exit 1; }
          done
          if grep -rn "@nacre.work/enterprise" --include="*.ts" --include="*.json" packages/ services/; then
            echo "::error::public core references enterprise modules"
            exit 1
          fi
