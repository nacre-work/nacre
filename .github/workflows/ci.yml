name: build

on:
  push:    { branches: [main] }
  pull_request:
  # Manual, because `pull_request` was the only way to ask for a run and that
  # left no recourse when Actions stopped scheduling them — no failed run to
  # re-run, nothing queued to wait for, and an empty commit as the only lever.
  # A required check needs a way to be asked for by hand.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    # Not for the unit tests in general — they inject their ports and need
    # nothing. It is here for the observability gauges, which are SQL and so
    # cannot be tested against a fake without testing the fake. The tests refuse
    # to skip when CI is set, so a missing service fails the job rather than
    # quietly reducing what it checks.
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: nacre_test }
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
      # For the rate limiter and the idempotency cache. Both are built out of
      # exactly the behaviours a fake would be written to have — `INCR` under
      # concurrency, and `SET NX` letting one caller win — so a fake of them
      # tests the fake. Those tests refuse to skip when CI is set.
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["6379:6379"]
      # For the hybrid query. The sparse slot, the `idf` modifier, a point
      # carrying a dense and a sparse vector at once and a prefetch that mixes
      # the two are all facts about Qdrant, and the defect that test replaces
      # was a set of individually-correct pieces nobody had put in front of a
      # database together. The same pin as docker-compose.yml, not `latest`.
      #
      # The test refuses to skip when CI is set, which is why the service is
      # here rather than the test being allowed to notice it is missing: this
      # job and acl-invariants both run `pnpm test:unit`, and a case that runs
      # in one of them is a case that stops running the day the other is the
      # one somebody reads.
      qdrant:
        image: qdrant/qdrant:v1.18.3
        ports: ["6333:6333"]
    env:
      NACRE_PG_URL: postgres://postgres:test@localhost:5432/nacre_test
      NACRE_QDRANT_URL: http://localhost:6333
      NACRE_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      # No version here: pnpm/action-setup refuses to run when the version is
      # given both as an input and as packageManager in package.json. That
      # field is the single source of truth, and it pins an exact version.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # The OpenAPI document is the contract and runs ahead of the code, so it
      # has nothing but this check keeping it honest.
      - run: pnpm lint:openapi
      # The compose file is the distribution. It pins what each profile
      # contains, because Compose accepts an unknown profile name silently and
      # hands back the unprofiled services — so a typo starts a working stack
      # and nobody notices.
      - run: pnpm lint:compose
      # Every workflow that gates a pull request can be started by hand. The
      # reason lived in a comment in this file, which is why three workflows had
      # it and the required one did not — a comment does not travel to the next
      # file, and it certainly does not travel to another repository.
      - run: pnpm lint:workflows
      # docs/config.md is the contract a self-hoster deploys against. This fails
      # if the core reads a NACRE_ variable the reference omits, or .env.example
      # seeds one it does not explain — the "validated at startup and read by
      # nothing / read by the code and documented nowhere" defect, which is the
      # single most-repeated one in this repository's history.
      - run: pnpm lint:config
      - run: pnpm typecheck
      - run: pnpm build
      # The entry points are what docker-compose runs. Until they existed it ran
      # a library barrel that exited zero without doing anything.
      - run: pnpm lint:entrypoints
      # lint:acl-groups is not here: it lists the acl project, which collects by
      # importing, and those tests refuse to load when CI is set without a
      # Qdrant to point at. It runs as the first step of acl-invariants, which
      # has both services — the job it protects.
      #
      # This one is here rather than only in release, where it is a gate: an
      # unpublishable manifest should fail on the pull request that wrote it,
      # not months later on the tag that was supposed to ship it.
      # Apache 2.0 §4(a) and §4(d) travel with anything redistributed, and npm
      # only picks these up from a package's own root — so a workspace with one
      # copy at the repository root publishes neither. All four tarballs on npm
      # today contain no LICENSE and no NOTICE.
      - run: pnpm lint:legal
      - run: pnpm lint:publish
      # Here and not only at release, which is where it lived and where it is
      # too late: the pull request that bumps the version is the one that knows
      # whether docs/upgrading.md gained a section for it, and running the check
      # only after the merge left main at a version that could not ship.
      - run: pnpm lint:upgrading
      # No handler compares a caller's role to a role name. This check was
      # written with the permission ceiling and then wired into nothing at all,
      # which is how it comes to be listed here alongside the check that found
      # it — `lint:workflows` now fails on a `lint:*` script no workflow runs.
      - run: pnpm lint:admin-gate
      # Every class the admin UI puts on an element is one admin.css defines.
      # A class name is a contract between a TypeScript string and a CSS
      # selector with nothing in between: the consent screen shipped six uses
      # of two classes that existed in no stylesheet, and the page still
      # rendered — just with the checkboxes running together across the line.
      - run: pnpm lint:admin-classes
      - run: pnpm lint:admin-layout
      - run: pnpm lint:tokens
      - run: pnpm lint:stored-error
      - run: pnpm lint:email-rule
      # And no screen asks a person to type an id. Nobody knows a uuid: the one
      # who has it copied it out of the picker directly above, and the one who
      # does not gets the 404 that means "no such thing, or not yours".
      - run: pnpm lint:admin-ids
      # Every collection is built by collectionConfig(). Shard count and
      # replication factor are fixed at creation, so a collection built from an
      # inline literal is shaped unlike every other one and can only be
      # reshaped by copying every point — and two of the three creation sites
      # were exactly that literal, spelled out again.
      - run: pnpm lint:collection-config
      # One generated-password implementation, and one word list. There were
      # two, with two different strengths — 41.9 bits from `init` and 35.3 from
      # the endpoint an administrator onboards a colleague with — and a comment
      # claiming 70. Nothing compared them.
      - run: pnpm lint:password
      # Every Dockerfile is published and every published image is checked for
      # both architectures. The embedding adapter's Dockerfile was written,
      # built by this job on both, and named by no release step — so the service
      # compiled and had no artifact anybody could pull.
      - run: pnpm lint:images
      # The front door's proxy headers, in every location that proxies. Two
      # rules, each found by starting the stack and reading one header, and each
      # of which has to hold in four places: `Host $http_host` because `$host`
      # strips the port, and `X-Forwarded-Proto $nacre_forwarded_proto` because
      # `$scheme` is this container's connection and not the client's — which
      # made every deployment behind a TLS terminator advertise plaintext URLs
      # for its own discovery documents. The e2e smoke proves both branches
      # against a running stack; this catches the fifth location.
      - run: pnpm lint:nginx
      # Every embedding client bounds the batch it sends. An endpoint refuses
      # above its own limit rather than splitting — TEI answers 413 above 32 —
      # and the worker marks such a document `failed`, which nothing retries.
      # Two clients had the defect with nothing making them agree.
      - run: pnpm lint:embed-batch
      # A document describing the authz suite by range reaches its last case.
      # The plan grew from fifteen to twenty-five and seven documents went on
      # saying T1-T15 — including CONTRIBUTING.md and the section of
      # docs/extensions.md that tells a module author which suite to run, so
      # somebody could run two thirds of it and believe they had run it.
      - run: pnpm lint:test-plan-range
      # Every caller of a model endpoint an operator configured reports a
      # refusal through one function. A bare status is the wrong answer on 401
      # and 403, where the cause is that this client sends no credential and has
      # nowhere to hold one — which an operator cannot work out from `401`.
      - run: pnpm lint:endpoint-errors
      # Every vector slot the collection declares has a producer on both sides.
      # The `bm25` slot was declared from the first collection ever created,
      # described in docs/architecture.md as half of how search works, and
      # accepted by buildHybridQuery — and written by nothing and queried by
      # nothing, for the entire life of the project. Every piece was correct on
      # its own, so every suite was green: a slot with no writer is not an
      # ingest error, a branch never built is not a query error, and fusion
      # absorbs a prefetch that returns nothing without a trace.
      - run: pnpm lint:sparse
      - run: pnpm lint:audit-target
      # Four spellings of "act on this person" — demote, disable, delete,
      # reset the password — each of which had to remember that a
      # `platform_admin` is not administered from inside an organization, with
      # nothing that knew there were four. Three of them forgot. The reset was
      # the worst: it returns the plaintext, so an `org_admin` could take over
      # the account that administers the installation from an endpoint scoped to
      # one tenant.
      - run: pnpm lint:platform-admin-target
      # Every workspace manifest reaches the image. The Dockerfile copies them
      # one line at a time so a source-only change reuses the dependency layer,
      # and that list did not get `packages/cli` — so pnpm inside the image saw
      # seven projects instead of eight, the eighth got no node_modules, and the
      # build failed on an import of a package sitting in the tree. No other job
      # can reproduce it: everywhere else the workspace is whole.
      - run: pnpm lint:image-packages
      # Nothing on the registry carries the workspace protocol. `pnpm pack`
      # rewrites it and `npm publish` from a directory does not, so a hand
      # publish uploads a version nobody can install — which is what happened
      # to @nacre.work/cli@0.14.3, and which nothing noticed because it
      # publishes, renders and appears exactly like a good one. Deprecating a
      # broken version is what turns this green, so the path out is the action
      # that should be taken anyway.
      - run: pnpm lint:published
      - run: pnpm migrate
      - run: pnpm test:unit

  # The Python components. Both of them sit at the edges the rest of the system
  # is careful about: the parser is where an authenticated caller picks the
  # destination of an outbound request, and the embedding adapter is where an
  # installation's document text leaves it.
  #
  # **Discovered rather than listed.** This job named `parser` alone for as long
  # as there was one sidecar, and adding a second is exactly when a hard-coded
  # name becomes a component with no tests running — the shape this repository
  # keeps finding. The loop below fails if it finds none, so a rename cannot
  # turn it into a job that passes having tested nothing.
  sidecars:
    name: sidecars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Test every sidecar under services/
        run: |
          set -euo pipefail
          found=0
          for dir in services/*/; do
            [ -f "${dir}app.py" ] || continue
            found=$((found + 1))
            echo "::group::${dir}"
            # A pinned manifest where there is one. The parser has a single
            # dependency because it runs hostile input; the adapter has none at
            # all, because it sees every document's text.
            if [ -f "${dir}requirements.txt" ]; then
              pip install -r "${dir}requirements.txt"
            fi
            python -m unittest discover -s "${dir%/}" -t . -v
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no sidecar found under services/; this job tested nothing"
            exit 1
          fi
          echo "$found sidecar(s) tested"

  # The public repo must build and test without access to nacre-enterprise.
  # If this job fails, the open/commercial boundary has leaked.
  # The console, in a real browser, on every screen there is a picture of.
  #
  # `scripts/screenshots.mjs` regenerates `docs/assets/admin/` and had always
  # been a **generator** somebody ran by hand. It carries assertions now — no
  # page error, no unstubbed call, the picture is of the screen it is named
  # after, and every control has room above it — and a check nobody runs is
  # worse than no check, which is this repository's own rule.
  #
  # **The images are not compared**, deliberately. Whether a layout "fits" is
  # decided by the font the runner happens to have, so a byte comparison would
  # be red on somebody's machine and green here for reasons that are about
  # neither the code nor the design — the sibling repository lost an afternoon
  # to exactly that. What is asserted is what a browser *decides*: geometry,
  # errors, and which view rendered.
  #
  # Playwright is installed for the job rather than being a dependency, on the
  # same argument the script's own header makes: a browser driver in every
  # contributor's `pnpm install` is the wrong trade for a script run rarely.
  console:
    name: console
    runs-on: ubuntu-latest
    # A database, because this job now drives more than a stubbed screen: the
    # WebAuthn ceremony runs a real browser against a real server against this,
    # and both 0.18.0 defects it would have caught were routes nothing had ever
    # asked the *server* for. Here rather than in a job of its own, since the
    # expensive half — installing a browser — is already paid for above.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nacre
          POSTGRES_PASSWORD: nacre
          POSTGRES_DB: nacre
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nacre"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The whole workspace, not `--filter admin`: the console's `tsc -b` needs
      # the SDK's declarations, and a filtered build leaves it with fifteen
      # `Cannot find module '@nacre.work/sdk'` errors. Found by this job failing
      # in fifteen seconds, before it ever reached a browser.
      - run: pnpm build
      - name: every screen in a browser
        run: |
          set -euo pipefail
          # Into a directory of its own, so this repository stays free of it.
          # An ESM `import` resolves from the importing file rather than from
          # NODE_PATH, so the script is told where the package is.
          tools=$(mktemp -d)
          printf '{"name":"nacre-console-check","private":true}\n' > "$tools/package.json"
          (cd "$tools" && pnpm add playwright@1 >/dev/null)
          "$tools/node_modules/.bin/playwright" install --with-deps chromium
          # The module's own path, not NODE_PATH: this is an ESM import and
          # NODE_PATH is a CommonJS mechanism, which the script's header says
          # and the first version of this job ignored.
          NACRE_PLAYWRIGHT="$tools/node_modules/playwright/index.mjs" node scripts/screenshots.mjs
          echo "$tools" > /tmp/nacre-playwright-dir
      - name: the WebAuthn ceremony, end to end
        env:
          NACRE_PG_URL: postgres://nacre:nacre@127.0.0.1:5432/nacre
        run: |
          set -euo pipefail
          # The workspace's own build, named directly. The first version tried
          # the installed package first and fell back, which worked and printed
          # a full MODULE_NOT_FOUND stack on the way — a step that succeeds
          # while its log reads like a failure is one somebody debugs instead
          # of reads.
          node packages/core/dist/migrate-main.js
          NACRE_PLAYWRIGHT="$(cat /tmp/nacre-playwright-dir)/node_modules/playwright/index.mjs" \
            node scripts/webauthn-e2e.mjs
      # The images this wrote are thrown away with the runner. Regenerating them
      # is the author's job, and `git status` on their machine is what says the
      # committed ones are stale — not a runner whose fonts are not theirs.

  boundary:
    name: boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core must not reference private packages
        run: |
          set -euo pipefail
          # grep exits 2 when a search path is missing, and `if grep` reads
          # that as "no match" — so a renamed directory would silently turn
          # this check into a no-op. Fail loudly instead.
          for d in packages services; do
            [ -d "$d" ] || { echo "::error::$d/ is missing; boundary check cannot run"; exit 1; }
          done
          if grep -rn "@nacre.work/enterprise" --include="*.ts" --include="*.json" packages/ services/; then
            echo "::error::public core references enterprise modules"
            exit 1
          fi

  # The two images the Helm chart names in its defaults must actually build,
  # **on both architectures the release publishes**. "This image could not be
  # built by anyone" was a real state once — a pnpm step that needs a TTY, in a
  # `docker build` that never has one — and the only place that surfaces is a
  # build. Built here on every pull request, not pushed; the release workflow
  # pushes the same Dockerfiles to ghcr on a version bump.
  #
  # arm64 is not decoration. It is what an Apple Silicon laptop and an arm64
  # node pull, and building it only at release time means the first person to
  # find a cross-build broken is whoever ran `docker compose up` on a Mac.
  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: nacre (api, mcp, worker) — both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
      - name: nacre-web (the admin UI) — both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: web
          push: false
          platforms: linux/amd64,linux/arm64

      - name: nacre-parser — both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.parser
          push: false
          platforms: linux/arm64,linux/amd64

      - name: nacre-embedding-adapter — both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.embedding-adapter
          push: false
          platforms: linux/arm64,linux/amd64

      # Building is not running, and for a cross-built image those are further
      # apart than usual: the node image's build stage is pinned to
      # $BUILDPLATFORM, so a production dependency that did carry a native
      # binary would be compiled for the *builder* and copied into an arm64
      # runtime that cannot execute it. That produces an image which builds
      # cleanly and dies on its first import.
      #
      # So start the arm64 image under emulation and let it reach configuration
      # validation. Exit 2 is `ConfigError` — the process loaded every module in
      # the graph (pg, jose, the Qdrant client) and got as far as complaining
      # about an empty environment, which is the whole assertion. An
      # architecture fault, a missing module or a broken binary is any other
      # code.
      - name: the arm64 image runs
        run: |
          set -euo pipefail
          docker buildx build --platform linux/arm64 --load -f docker/Dockerfile -t nacre:arm64 .
          docker buildx build --platform linux/arm64 --load -f docker/Dockerfile.parser -t nacre-parser:arm64 .

          set +e
          out="$(docker run --rm --platform linux/arm64 nacre:arm64 node packages/api/dist/main.js 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" != 2 ]; then
            echo "::error::the arm64 api exited $code; a configuration refusal is 2"
            exit 1
          fi

          # The sidecar's only dependency, imported and *used* on the
          # architecture it will run on.
          #
          # This step used to import a pure-Python package, where portability
          # was close to a formality. `pdf-inspector` is a compiled Rust
          # extension, so this is now the check that the aarch64 wheel exists,
          # was installed rather than built from the sdist, and loads — a
          # missing wheel is a parser image that builds and then dies on its
          # first PDF, on one architecture only.
          #
          # It extracts from a real PDF rather than importing the module: a
          # PyO3 extension that imports has proved almost nothing, because the
          # symbols resolve when a function is called. The generator is the one
          # the compose smoke already uses, mounted in.
          python3 scripts/ci/make-pdf.py /tmp/arm64.pdf "extraction works on arm64"
          docker run --rm --platform linux/arm64 -v /tmp/arm64.pdf:/tmp/in.pdf:ro \
            nacre-parser:arm64 python -c "
          import platform, pdf_inspector
          text = pdf_inspector.extract_text_bytes(open('/tmp/in.pdf', 'rb').read())
          assert 'arm64' in text, 'the aarch64 extractor returned %r' % text
          print('pdf-inspector on', platform.machine(), '->', repr(text.strip()))
          "

  # The whole loop, booted from the Compose file the quickstart hands out. Every
  # other job asserts on a part; this one starts the parts together and runs a
  # request through all of them, which is where the defects a green unit suite
  # never sees have lived — a port collision, a healthcheck that fails a
  # transport that has no HTTP surface, a migration that ran after the API
  # opened, the worker indexing nothing. `minimal` starts no embedder, so a
  # stub answering the /embeddings contract is added through a CI-only overlay;
  # the smoke script drives init, a layer, a grant, ingest to indexed, a search
  # that returns the document and a revoke that removes it.
  #
  # The same overlay pulls MinIO forward into `minimal`. Object storage is a
  # `full` service and stays one, but binary ingest has nowhere to put a PDF's
  # bytes without a bucket — so without it the smoke could not prove that path
  # at all, only that the edge refuses it.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: configure the environment
        run: |
          cp .env.example .env
          # Point at the stub, and shrink the vector width — the vectors are
          # constant and meaningless, so eight floats index as well as a
          # thousand and faster.
          # Appended rather than sed-ed, and that is the fix rather than a
          # tidy-up. `.env.example` now offers the embedder as three commented
          # choices — host-native, the profile's own TEI, the adapter — because
          # there is no default worth shipping. A substitution anchored at
          # `^NACRE_DEFAULT_EMBEDDING_ENDPOINT=` matches none of them, and a sed
          # that matches nothing succeeds silently: the file came out with no
          # embedder configured at all, and `init` refused with exactly the
          # message it should have. The model line was never sed-ed here and had
          # been relying on .env.example shipping one uncommented.
          #
          # The S3 block below already does it this way, for the same reason.
          cat >> .env <<'EOF'
          NACRE_DEFAULT_EMBEDDING_ENDPOINT=http://stub-embedder:8000
          NACRE_DEFAULT_EMBEDDING_MODEL=stub
          NACRE_DEFAULT_EMBEDDING_DIM=8
          EOF
          # Object storage, which .env.example ships commented out because it
          # is off by default. Uncommented here rather than sed-ed line by
          # line, and appended so the values are visible in one block: binary
          # ingest refuses at the edge without them, so the PDF half of the
          # smoke would test the refusal and nothing else.
          cat >> .env <<'EOF'
          NACRE_S3_ENDPOINT=http://minio:9000
          NACRE_S3_BUCKET=nacre
          NACRE_S3_ACCESS_KEY=minioadmin
          NACRE_S3_SECRET_KEY=minioadmin
          NACRE_S3_FORCE_PATH_STYLE=true
          EOF
      - name: build and start minimal, plus the stub embedder
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile minimal up -d --build
      - name: drive the loop
        run: bash scripts/ci/e2e-smoke.sh
      - name: logs on failure
        if: failure()
        # api and worker only, and tailed — the datastore init banners drown the
        # two logs that say why the loop stopped.
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile minimal logs --no-color --tail 40 api worker
      - name: tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile minimal down -v

  # ── the profile the quickstart points a reader at ──────────────────────────
  #
  # `demo` is what `docs/quickstart.md` tells a first-time reader to run, and
  # nothing started it on a pull request until this job. `lint:compose` pins
  # what each profile *contains*, which is a different question from whether it
  # comes up: the last time somebody ran this one by hand it produced four
  # defects, every one of them green in every suite.
  #
  # Separate from `e2e` rather than more of it, because it tests something that
  # job structurally cannot. `minimal` runs a stub embedder returning a
  # constant vector, so relevance decides nothing there — which is what makes
  # it a clean test of the ACL pre-filter and a useless one for retrieval.
  # This runs a real model over a real corpus, and asserts the demo's own
  # claim: the same query, asked by three people, comes back three different
  # ways. The administrator finding the contract number is what says the corpus
  # indexed at all; the engineer and the contractor not finding it is the half
  # no unit test can prove, because a unit test builds the permission plan it
  # then asserts against.
  #
  # No CI overlay. The profile brings its own embedder, and adding the stub
  # would replace the one thing this job exists to exercise.
  demo:
    name: demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: configure the environment
        # The defaults, and nothing else. `demo-seed` carries the embedding
        # endpoint, model and dimensions itself — they are `init`'s arguments
        # rather than `loadConfig`'s since core 0.13.0 — so a deployment of
        # this profile needs no embedder configuration of its own, and writing
        # one here would be testing an arrangement the quickstart does not
        # describe.
        run: cp .env.example .env
      - name: build and start the demo profile
        run: docker compose --profile demo up -d --build
      - name: three people, one query, three answers
        run: bash scripts/ci/demo-smoke.sh
        env:
          COMPOSE: docker compose
      - name: logs on failure
        if: failure()
        run: docker compose --profile demo logs --no-color --tail 60 demo-seed demo-embedder api worker
      - name: tear down
        if: always()
        run: docker compose --profile demo down -v
