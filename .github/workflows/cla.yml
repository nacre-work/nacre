name: cla

# Pull requests only. There is nothing to check on a push to main: whatever is
# there merged through a pull request, and a direct push by someone who can push
# directly is not a contribution this gate is for.
#
# `pull_request` and deliberately not `pull_request_target`. The latter is what
# a CLA bot normally needs, because commenting on a fork's pull request needs
# write permissions — and it runs with the repository's secrets in the context
# of untrusted code, which is a large hole to open for a courtesy comment. This
# job needs no write access and no secrets: it reads the signature list from the
# base branch and writes its instructions to the job summary, which renders on
# the checks page where a first-time contributor is already looking.
on:
  pull_request:
    branches: [main]
    # `edited` on top of the three defaults, and it is the `branches:` filter
    # above that makes it load-bearing rather than noise. A pull request opened
    # against another branch — the ordinary shape of a stack — is filtered out,
    # and **changing its base to main is an `edited` event and nothing else**:
    # no `opened`, no `synchronize`, no push. So the pull request arrives at
    # main having never been asked for a signature, and the gate is not red, it
    # is absent. Found on a stacked pull request retargeted after its parent
    # merged. The cost is a seven-second job re-running when somebody edits a
    # title.
    types: [opened, synchronize, reopened, edited]
  # Manual, for the same reason `ci.yml` grew it and this file did not: when
  # Actions stops scheduling `pull_request` runs there is no failed run to
  # re-run and nothing queued to wait for, and a required check with no way to
  # be asked for by hand blocks a pull request until somebody pushes an empty
  # commit. That lesson was applied to `ci`, `acl-invariants` and `release`, and
  # missed here — the same shape as a fix made in one file and not its sibling.
  #
  # The two refs are inputs because a dispatch has no `pull_request` context.
  # `base` defaults to main, which is the only base this gate runs against; the
  # head defaults to the ref the dispatch was made on, which is the branch.
  workflow_dispatch:
    inputs:
      base:
        description: The branch to read the signature list from
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cla:
    name: cla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history of both sides. The default shallow clone has no
          # merge base, so `git log base..head` returns every commit ever made
          # and every past contributor reads as unsigned.
          fetch-depth: 0

      # The signature list is read from the **base** either way, so a pull
      # request still cannot sign itself. A dispatch names the base explicitly
      # and the head is whatever ref it ran on.
      - name: Everyone who wrote this has signed
        run: |
          node .github/scripts/check-cla.mjs \
            "origin/${{ github.base_ref || inputs.base }}" \
            "${{ github.event.pull_request.head.sha || github.sha }}"
