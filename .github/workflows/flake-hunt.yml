# Run the suite until something falls over.
#
# **This exists because a flake failed the 0.19.0 release.** A case read the
# wall clock three times with a thirty-second window and a two-second body, so
# it failed about one run in fifteen — green on the pull request, red on the
# merge that *was* the release. Nothing published, nothing tagged.
#
# `lint:test-clock` closes that mechanism. This closes the class: the next flake
# will be a tie in a fused score, a row order nobody pinned, or two connections
# racing, and the only thing that knows about all of those is the runner, run
# more than once.
#
# **Nightly rather than on a pull request.** Ten passes is ten times the wall
# clock and ten times the database for a signal about the *suite* rather than
# about the change in front of it — and a flake is a property of `main`, so it
# is looked for on `main`'s clock. A find is then a red scheduled run somebody
# reads in the morning instead of a red release nobody can undo.
name: flake hunt

on:
  schedule:
    # 02:30 UTC. Away from the hour, where everybody else's cron is.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: how many passes
        default: '10'

permissions:
  contents: read

jobs:
  hunt:
    name: hunt
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nacre_test
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['6379:6379']
      # The hybrid query's cases are Qdrant's, and one of them was itself a coin
      # flip until the fixture stopped leaving two points on equal scores. A
      # hunt without this service is a hunt over the half that never flaked.
      qdrant:
        image: qdrant/qdrant:v1.18.3
        ports: ['6333:6333']
    env:
      NACRE_PG_URL: postgres://postgres:test@localhost:5432/nacre_test
      NACRE_QDRANT_URL: http://localhost:6333
      NACRE_REDIS_URL: redis://localhost:6379/0
      NACRE_TEST_S3_ENDPOINT: http://localhost:9000
      NACRE_TEST_S3_BUCKET: nacre-live
      NACRE_TEST_S3_ACCESS_KEY: minioadmin
      NACRE_TEST_S3_SECRET_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4

      # A real object store, for the reason `ci.yml` states at length: `s3.ts`
      # says every property in it is verified against a real MinIO, and until
      # `s3-live.test.ts` nothing in CI did. This suite refuses to skip those
      # cases when `CI` is set, so the fixture belongs wherever the suite runs
      # — which is four workflows, and `lint:workflows` is what knows that.
      - name: a real object store to sign against
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:9000/minio/health/live >/dev/null
          docker exec minio mc alias set live http://localhost:9000 minioadmin minioadmin
          docker exec minio mc mb --ignore-existing live/nacre-live
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm migrate
      - name: the same suite, over and over
        run: node scripts/flake-hunt.mjs --runs ${{ inputs.runs || '10' }}
