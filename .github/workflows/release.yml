name: release

# No tag trigger, and no step that waits for a person.
#
# This fired on `v*` until a tag was pushed at a commit whose publish step could
# not authenticate. Every gate passed, the publish failed, and the only way
# forward was someone moving the tag by hand — a release blocked on a human
# doing the right git incantation at the right commit. Shipping is a
# consequence of what is on main, so main is what decides.
#
# The version in `packages/*` names something the registry does not have, or it
# does not. When it does, this runs every gate against that tree, publishes, and
# only then writes the tag and the GitHub release. In that order, because a tag
# written first is a tag that outlives a failed publish, which is exactly the
# state this replaced.
on:
  push:
    branches: [main]
  # Not the normal path — a merge to main is. This exists so a registry blip
  # can be retried without an empty commit, the same reason build has it.
  workflow_dispatch:

permissions:
  contents: read

# Never two releases at once, and never cancel one in flight: publishing is not
# an operation that can be interrupted and retried from the top without leaving
# some packages on the registry and some not.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Cheap, and runs on every push to main. No services, no install, no build —
  # it reads the manifests and asks the registry, so the expensive job below
  # only starts when there is something to publish.
  decide:
    name: decide
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: plan
        run: node scripts/release-plan.mjs

  npm:
    name: publish ${{ needs.decide.outputs.version }}
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the release, written after publishing
      id-token: write # the OIDC token npm exchanges for publish rights
    # The unit and ACL suites below are SQL and HTTP against real services, and
    # they refuse to skip when CI is set. A release that ran a smaller suite
    # than a pull request would be the one artifact nobody can take back, tested
    # least.
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: nacre_test }
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["6379:6379"]
      qdrant:
        image: qdrant/qdrant:v1.18.3
        ports: ["6333:6333"]
    env:
      NACRE_PG_URL: postgres://postgres:test@localhost:5432/nacre_test
      NACRE_REDIS_URL: redis://localhost:6379/0
      NACRE_QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      # The version comes from packageManager in package.json — passing it here
      # as well makes pnpm/action-setup refuse to run.
      - uses: pnpm/action-setup@v4
      # No registry-url on purpose. It makes setup-node write an .npmrc holding
      # `_authToken=${NODE_AUTH_TOKEN}` and then set NODE_AUTH_TOKEN to its own
      # placeholder, XXXXX-XXXXX-XXXXX-XXXXX, when no token is passed. A
      # placeholder is a credential as far as the registry is concerned: it
      # rejects the write and, because npm masks an unauthorized write to a
      # scoped package as a missing one, the rejection arrives as
      # `404 Not Found - PUT .../@nacre.work%2fcore`. Publishing here is by OIDC
      # and there is no token, so there should be nothing that looks like one.
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The gates that run on every pull request run here too. main is protected
      # and every commit on it arrived green, but a release is the one artifact
      # nobody can take back and the cost of proving it again is minutes.
      - run: pnpm lint:publish
      # The version being published has a section in docs/upgrading.md.
      # A release body is a list of pull request titles, which is the right
      # thing for a changelog and not what an operator opens a release to
      # find out — whether this version wants a variable, a service, or a
      # backup first. "Nothing to do" is a section too; silence is not.
      - run: pnpm lint:upgrading
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm lint:openapi
      - run: pnpm lint:compose
      - run: pnpm lint:entrypoints
      - run: pnpm lint:legal
      # The nine below ran on every pull request and not here, which made this
      # job the smaller suite the comment above says it must never be. They are
      # not listed by hand anywhere: `lint:workflows` compares the two sets.
      - run: pnpm lint:config
      - run: pnpm lint:images
      - run: pnpm lint:password
      - run: pnpm lint:collection-config
      - run: pnpm lint:endpoint-errors
      - run: pnpm lint:sparse
      - run: pnpm lint:admin-gate
      - run: pnpm lint:admin-classes
      - run: pnpm lint:admin-ids
      - run: pnpm lint:workflows
      - run: pnpm migrate
      - run: pnpm test:unit

      # The gate that matters, and for a long time it was not here.
      #
      # `test:unit` excludes packages/core/authz by design — the leak suite has
      # its own job because it needs a real Qdrant. Without this, a release
      # could reach the registry without T1-T15, the property test against the
      # reference resolver, or the round trip ever having run against the tree
      # being published. Breaking one of those is, by this project's own rule, a
      # security incident.
      - run: pnpm lint:acl-groups
      - run: pnpm test:acl

      # The open/commercial boundary, for the same reason: these packages are
      # what a customer installs, and a core referencing the private repository
      # does not build for them at all.
      - name: core must not reference private packages
        run: |
          set -euo pipefail
          for d in packages services; do
            [ -d "$d" ] || { echo "::error::$d/ is missing; boundary check cannot run"; exit 1; }
          done
          if grep -rn "@nacre.work/enterprise" --include="*.ts" --include="*.json" packages/ services/; then
            echo "::error::public core references enterprise modules"
            exit 1
          fi

      # Trusted publishing, no token. Each package is configured on npmjs.com
      # under Settings -> Trusted Publisher against this repository and this
      # workflow file; the registry exchanges the OIDC token for a short-lived
      # credential. There is no NPM_TOKEN secret, so there is none to leak or
      # rotate — and nothing here to configure per run.
      #
      # `npm publish` rather than `pnpm publish`, and this is not a preference.
      # pnpm 10 implements no part of trusted publishing: its bundle carries no
      # token exchange, no ACTIONS_ID_TOKEN_REQUEST_URL, no OIDC code at all.
      # It sent the only credential it could see and the release died on a 404
      # naming the package. pnpm 11 does implement the exchange, and moving the
      # workspace onto it folds these two commands back into one.
      #
      # `pnpm pack` still packs, because it is what rewrites `workspace:*` into
      # a concrete version. npm publishes the manifest as written, protocol and
      # all, and every install then fails on resolution.
      #
      # publishConfig carries `access` but deliberately not `provenance`: npm
      # turns provenance on itself once the exchange succeeds.
      - name: publish
        run: |
          set -euo pipefail

          # Checked here because npm will not. Without id-token: write it logs
          # one line at silly level, which nothing prints, and then publishes
          # with whatever credential it already had.
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || {
            echo "::error::no OIDC token to exchange — this job needs permissions.id-token: write"
            exit 1
          }

          # OIDC publishing landed in npm 11.5.0. The npm bundled with Node 22
          # predates it and fails the same silent way pnpm 10 did.
          npm install -g npm@11.19.0
          npm --version

          tarballs="$RUNNER_TEMP/tarballs"
          mkdir -p "$tarballs"

          # Only what the registry is still missing, so a run that published
          # some packages and then failed can be re-run without tripping over
          # the ones that made it.
          pending="$(node scripts/release-plan.mjs --pending)"
          [ -n "$pending" ] || { echo "::error::nothing pending, but decide said there was"; exit 1; }

          for package in $pending; do
            rm -f "$tarballs"/*.tgz
            pnpm --filter "$package" pack --pack-destination "$tarballs"
            tarball="$(ls "$tarballs"/*.tgz)"

            # Verbose because the exchange failing is logged at that level and
            # nowhere else: npm falls through to publishing unauthenticated,
            # and a trusted publisher that was never configured for a package
            # then surfaces as a 404 claiming the package does not exist.
            npm publish --loglevel verbose "$tarball"
          done

      # After the publish, never before. Both are idempotent so a re-run over a
      # release that half succeeded finishes it rather than failing on what is
      # already there.
      - name: tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already tagged"
          else
            git tag -a "v$VERSION" -m "v$VERSION"
            git push origin "v$VERSION"
          fi

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already has a release"
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes
          fi

          # The generated notes are the pull request titles, and they stay —
          # they are the changelog. What goes above them is the line an operator
          # came for: where to read what this version asks of them.
          # `lint:upgrading` has already refused a version with no section, so
          # the document it points at has one.
          #
          # A second step rather than a flag on the first, because how
          # --notes-file and --generate-notes combine is a detail of the CLI and
          # this does not need to know. Idempotent on the marker, like
          # everything else here, so re-running a finished release is a no-op.
          #
          # The link carries no anchor: the per-version headings end in a
          # summary, so the fragment is not derivable from the number, and a
          # link that always resolves beats a clever one that might not.
          body="$(gh release view "v$VERSION" --json body -q .body)"
          case "$body" in
            *'### Upgrading'*)
              echo "v$VERSION notes already carry the upgrade pointer"
              ;;
            *)
              gh release edit "v$VERSION" --notes "$(printf \
                '### Upgrading\n\nRead [docs/upgrading.md](https://github.com/%s/blob/v%s/docs/upgrading.md) before upgrading — the procedure, and what this version asks of you.\n\n%s' \
                "$GITHUB_REPOSITORY" "$VERSION" "$body")"
              ;;
          esac

  # The container images the Helm chart names in its defaults —
  # ghcr.io/nacre-work/nacre and -parser. Nothing built them: this workflow
  # published the npm packages and stopped, so `helm install` on the chart's
  # defaults pulled a tag that did not exist. Built here, from the same tree the
  # npm packages came from and only once they have published, so the two halves
  # of a release do not disagree about what a version is.
  #
  # Tagged with the version and `latest`. The chart's image.tag defaults to
  # Chart.appVersion, so the version tag is the one an untouched values file
  # resolves to; a deployment that wants immutability pins the digest this job
  # prints.
  #
  # **amd64 and arm64.** Both images were amd64-only through 0.5.1 — no
  # `platforms` key, so buildx built for the runner — which made every Apple
  # Silicon laptop, and every arm64 node, run the product under emulation if it
  # ran it at all. Nothing reported it, because Docker Desktop pulls the amd64
  # manifest and starts it: the failure is a slow container, not an error.
  containers:
    name: containers ${{ needs.decide.outputs.version }}
    needs: [decide, npm]
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
      # binfmt, so the arm64 half of each manifest can run whatever its
      # Dockerfile still executes on the target platform — `adduser` in the node
      # image's runtime stage, `pip install` in the parser's. The node image's
      # expensive work is pinned to $BUILDPLATFORM and never touches this.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: nacre (api, mcp, worker — one image, three entry points)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/nacre-work/nacre:${{ needs.decide.outputs.version }}
            ghcr.io/nacre-work/nacre:latest

      # The admin UI, and it should have been here from the start.
      #
      # `docker/Dockerfile` has had a `web` stage — nginx serving the built
      # `packages/admin` bundle and proxying /v1 to the API — since the Compose
      # stack grew a front door. Compose builds it locally with `target: web`;
      # nothing published it, so `ghcr.io/nacre-work/nacre-web` did not exist and
      # the Helm chart had nothing to deploy.
      #
      # That absence then got written up in the chart's README as a decision —
      # "a deployment may reasonably put it behind its own auth proxy" — which
      # is true of the API too, and the chart deploys that. It was an omission
      # wearing a rationale, which is the shape this repository keeps removing.
      #
      # It matters more since the consent flow landed: `/oauth/authorize` sends
      # a browser to a screen in this bundle, so a deployment with no bundle has
      # a flow that ends in a redirect to nothing.
      - name: nacre-web (the admin UI, served by nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/nacre-work/nacre-web:${{ needs.decide.outputs.version }}
            ghcr.io/nacre-work/nacre-web:latest

      - name: nacre-parser (the Python sidecar)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.parser
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/nacre-work/nacre-parser:${{ needs.decide.outputs.version }}
            ghcr.io/nacre-work/nacre-parser:latest

      # Absent from `airgapped` and absent from `minimal`, but published: the
      # `hosted` Compose profile builds it from source and a Kubernetes
      # deployment cannot, so without this the adapter is a service only one
      # deployment shape can have. `lint:images` is what makes a new Dockerfile
      # that nobody publishes a failure rather than a discovery.
      - name: nacre-embedding-adapter (hosted embeddings)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.embedding-adapter
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/nacre-work/nacre-embedding-adapter:${{ needs.decide.outputs.version }}
            ghcr.io/nacre-work/nacre-embedding-adapter:latest

      # The published manifest, read back rather than assumed.
      #
      # `platforms:` is a request, and a build that quietly produced one
      # architecture would leave the same defect behind a workflow that says
      # otherwise — which is exactly how the images got here. This asserts the
      # tag that was just pushed carries both, and fails the release if it does
      # not.
      - name: both architectures are actually in the manifest
        run: |
          set -euo pipefail
          for image in nacre nacre-web nacre-parser nacre-embedding-adapter; do
            ref="ghcr.io/nacre-work/$image:${{ needs.decide.outputs.version }}"
            platforms="$(docker buildx imagetools inspect "$ref" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
            echo "$ref -> $platforms"
            for want in linux/amd64 linux/arm64; do
              case " $platforms " in
                *" $want "*) ;;
                *) echo "::error::$ref carries no $want"; exit 1 ;;
              esac
            done
          done
