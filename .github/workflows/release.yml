name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write        # the OIDC token npm exchanges for publish rights

jobs:
  npm:
    runs-on: ubuntu-latest
    # The unit tests below include the database gauges, which are SQL and refuse
    # to skip when CI is set. A release that ran a smaller suite than a pull
    # request would be the one artifact nobody can take back, tested least.
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: nacre_test }
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
      # Both here for the same reason as postgres: the suites below refuse to
      # skip when CI is set, and a release that quietly ran fewer of them than a
      # pull request is the one artifact nobody can take back.
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["6379:6379"]
      qdrant:
        image: qdrant/qdrant:v1.18.3
        ports: ["6333:6333"]
    env:
      NACRE_PG_URL: postgres://postgres:test@localhost:5432/nacre_test
      NACRE_REDIS_URL: redis://localhost:6379/0
      NACRE_QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      # The version comes from packageManager in package.json — passing it here
      # as well makes pnpm/action-setup refuse to run.
      - uses: pnpm/action-setup@v4
      # No registry-url on purpose. It makes setup-node write an .npmrc holding
      # `_authToken=${NODE_AUTH_TOKEN}` and then set NODE_AUTH_TOKEN to its own
      # placeholder, XXXXX-XXXXX-XXXXX-XXXXX, when no token is passed. A
      # placeholder is a credential as far as the registry is concerned: it
      # rejects the write and, because npm masks an unauthorized write on a
      # scoped package as a missing one, the rejection arrives as
      # `404 Not Found - PUT .../@nacre.work%2fcore`. Publishing here is by
      # OIDC and there is no token, so there should be nothing that looks like
      # one.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Nothing stood between a tag and the registry. Every `v*` tag published
      # whatever the manifests held, which was 0.0.0 — the first tag succeeding
      # and every one after it failing with "cannot publish over an existing
      # version", a message that reads like a registry problem rather than like
      # the tag never having been applied to anything.
      #
      # This also catches a published package depending on a private one, and a
      # bin with no shebang. Both were true, and both fail at `npm install`
      # rather than anywhere a test could see.
      - name: the tag and the manifests agree, and the result is installable
        run: pnpm lint:publish "${{ github.ref_name }}"

      # A release is the one artifact nobody can take back. The gates that run
      # on every pull request run here too, against the tagged tree, because a
      # tag can be pushed to any commit — including one that never had a green
      # build.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm lint:openapi
      - run: pnpm lint:compose
      - run: pnpm lint:entrypoints
      - run: pnpm lint:legal
      - run: pnpm migrate
      - run: pnpm test:unit

      # The gate that matters, and it was not here.
      #
      # `test:unit` excludes packages/core/authz by design — the leak suite has
      # its own job because it needs a real Qdrant. So a tag could be pushed at
      # any commit and publish to the registry without T1-T15, the property test
      # against the reference resolver, or the round trip ever having run
      # against the tagged tree. Breaking one of those is, by this project's own
      # rule, a security incident; publishing without checking is worse than a
      # pull request that skips it, because the artifact cannot be withdrawn.
      - run: pnpm lint:acl-groups
      - run: pnpm test:acl

      # The open/commercial boundary, for the same reason: the packages being
      # published here are the ones a customer installs, and a core that
      # references the private repository does not build for them at all.
      - name: core must not reference private packages
        run: |
          set -euo pipefail
          for d in packages services; do
            [ -d "$d" ] || { echo "::error::$d/ is missing; boundary check cannot run"; exit 1; }
          done
          if grep -rn "@nacre.work/enterprise" --include="*.ts" --include="*.json" packages/ services/; then
            echo "::error::public core references enterprise modules"
            exit 1
          fi

      # Trusted publishing, no token. Each package is configured on npmjs.com
      # under Settings -> Trusted Publisher against this repository and this
      # workflow file; the registry exchanges the OIDC token above for a
      # short-lived credential. There is no NPM_TOKEN secret, so there is none
      # to leak or rotate.
      #
      # `npm publish` rather than `pnpm publish`, and this is not a preference.
      # pnpm 10 implements no part of trusted publishing: its bundle contains
      # no token exchange, no ACTIONS_ID_TOKEN_REQUEST_URL, no OIDC code at
      # all. It sent the only credential it could see — the placeholder above —
      # and the tag died on a 404 that named the package. pnpm 11 does
      # implement the exchange, and moving the workspace onto it folds these
      # two commands back into one.
      #
      # `pnpm pack` still packs, because it is what rewrites `workspace:*` into
      # a concrete version. npm publishes the manifest as written, protocol and
      # all, and every install then fails on resolution.
      #
      # publishConfig carries `access` but deliberately not `provenance`: npm
      # turns provenance on itself once the exchange succeeds, and the flag
      # breaks the one manual publish that has to bootstrap each package before
      # a trusted publisher can be configured for it at all.
      - name: publish
        run: |
          set -euo pipefail

          # Checked here because npm will not. Without id-token: write it logs
          # one line at silly level, which nothing prints, and then publishes
          # with whatever credential it already had.
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || {
            echo "::error::no OIDC token to exchange — this job needs permissions.id-token: write"
            exit 1
          }

          # OIDC publishing landed in npm 11.5.0. The npm bundled with Node 22
          # predates it and fails the same silent way pnpm 10 did.
          npm install -g npm@11.19.0
          npm --version

          tarballs="$RUNNER_TEMP/tarballs"
          mkdir -p "$tarballs"

          # From the same rule the checks above use, rather than a second list.
          packages="$(node scripts/check-publish.mjs --list)"

          for package in $packages; do
            rm -f "$tarballs"/*.tgz
            pnpm --filter "$package" pack --pack-destination "$tarballs"
            tarball="$(ls "$tarballs"/*.tgz)"

            # Verbose because the exchange failing is logged at that level and
            # nowhere else: npm falls through to publishing unauthenticated,
            # and a trusted publisher that was never configured for a package
            # then surfaces as a 404 claiming the package does not exist.
            npm publish --loglevel verbose "$tarball"
          done
