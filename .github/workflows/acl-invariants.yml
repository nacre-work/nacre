name: acl-invariants

# Deliberately a separate job rather than a step inside build. A failure here
# means a data leak, and it should show up as its own line in the checks list
# instead of hiding among unit tests.
#
# ─────────────────────────────────────────────────────────────────────────────
# STATUS: 9 of the 15 cases in docs/authz.md section 3.5 run. The other six
# need the HTTP surface, Qdrant, or Redis, and the `not yet covered` step below
# prints them on every run — including green ones, deliberately.
#
# This job may be a required check for what it does test. It is not yet
# evidence that the access-control invariants hold end to end, and the two
# saturation cases are the reason to care: T9 and T10 are what catch a
# post-filter, and an implementation that filters after ranking passes every
# case that runs today.
#
# When the vector store lands, add the postgres and qdrant services back along
# with a migration step, and move T9/T10 to implemented in test-plan.ts — the
# coverage test fails if that claim is made without a test to back it.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:    { branches: [main] }
  pull_request:
  schedule:
    - cron: "0 3 * * *"   # nightly: the exhaustive property-based run

jobs:
  acl-invariants:
    name: acl-invariants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: nacre_test }
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      # The integration tests refuse to skip when CI is set — a tenant-isolation
      # test that turns itself off because a variable is missing is the failure
      # mode this whole job exists to avoid.
      NACRE_PG_URL: postgres://postgres:test@localhost:5432/nacre_test
    steps:
      - uses: actions/checkout@v4
      # No version here: pnpm/action-setup refuses to run when the version is
      # given both as an input and as packageManager in package.json. That
      # field is the single source of truth, and it pins an exact version.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate

      # Split by group so a leak reads as "T3 failed" in the checks list rather
      # than as one number among fifty. The selector is `-t`, an alias of
      # --testNamePattern; `--grep` is not a vitest flag and silently ran
      # everything in the version of this file that shipped first.
      #
      # Each step goes through scripts/acl-group.mjs, which fails when the
      # selector matches nothing. `vitest -t` skips what does not match and
      # exits 0, so a renamed describe block would otherwise turn a leak-test
      # step green while checking nothing.
      - name: T1-T8 · baseline
        run: pnpm test:acl:group "baseline"
      - name: truth table · docs/authz.md 3.2
        run: pnpm test:acl:group "truth table"
      - name: T11-T15 · adversarial
        run: pnpm test:acl:group "adversarial"

      # Fast on a pull request, exhaustive at night. The nightly run is where a
      # rare interaction between deny and inheritance actually gets found.
      - name: property · resolve vs the reference implementation
        run: pnpm test:acl:property
        env:
          PROPERTY_RUNS: ${{ github.event_name == 'schedule' && '10000' || '500' }}

      # Prints on green runs too. A gap nobody sees is a gap nobody closes.
      - name: not yet covered
        run: pnpm authz:pending
