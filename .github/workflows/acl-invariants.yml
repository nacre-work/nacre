name: acl-invariants

# Deliberately a separate job rather than a step inside build. A failure here
# means a data leak, and it should show up as its own line in the checks list
# instead of hiding among unit tests.
#
# ─────────────────────────────────────────────────────────────────────────────
# STATUS: this job does NOT yet gate against leaks.
#
# It runs the authz tests that exist, and what exists today is the permission
# implication table — one rule of the model. T1-T15 from docs/authz.md section
# 3.5 need the resolver, the schema, and the vector store, none of which are
# written yet.
#
# Do not add this job to the required checks as evidence of leak testing until
# T1-T15 actually run. A required check that passes without running them is
# worse than no check, because it gets believed. When the resolver lands,
# restore what was removed here: the postgres and qdrant services, the
# migration step, three named steps selecting baseline / saturation /
# adversarial with `-t`, and the nightly property-based run against the
# reference implementation.
#
# Note for whoever restores those steps: the selector is `-t` (alias of
# --testNamePattern). The version of this file that shipped with the initial
# commit used `--grep`, which vitest does not accept.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:    { branches: [main] }
  pull_request:

jobs:
  acl-invariants:
    name: acl-invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # The acl project sets no passWithNoTests, at any level. If this step
      # ever reports success having run zero tests, that is the bug.
      - name: authz tests
        run: pnpm test:acl
