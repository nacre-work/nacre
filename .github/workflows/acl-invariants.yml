name: acl-invariants

# Deliberately a separate job rather than a step inside build. A failure here
# means a data leak, and it should show up as its own line in the checks list
# instead of hiding among unit tests.
#
# ─────────────────────────────────────────────────────────────────────────────
# STATUS: all 15 cases in docs/authz.md section 3.5 run, against a real
# Postgres, a real Qdrant, and the HTTP surface over a real socket.
#
# This job is now a gate on what that document specifies. It is not a gate on
# what nobody has thought to specify, and the difference matters: every case
# here was written from the spec, so a leak nobody imagined is still a leak
# nobody tests for. Adding a case to test-plan.ts is how that changes — the
# coverage test refuses a case claimed without a test behind it, in either
# direction.
#
# The integration tests refuse to skip when CI is set, so a missing service URL
# fails the job instead of quietly reducing what it checks.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:    { branches: [main] }
  pull_request:
  # Manual, because `pull_request` was the only way to ask for a run and that
  # left no recourse when Actions stopped scheduling them — no failed run to
  # re-run, nothing queued to wait for, and an empty commit as the only lever.
  # A required check needs a way to be asked for by hand.
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # nightly: the exhaustive property-based run

jobs:
  acl-invariants:
    name: acl-invariants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: nacre_test }
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
      qdrant:
        # The same pin as docker-compose.yml, not `latest`. Testing against
        # whatever was published this morning while shipping a fixed version
        # means the version operators run is the one nothing ran the suite
        # against — and a `latest` that moves turns an unrelated pull request
        # red for reasons no one changed.
        image: qdrant/qdrant:v1.18.3
        ports: ["6333:6333"]
    env:
      # The integration tests refuse to skip when CI is set — a tenant-isolation
      # test that turns itself off because a variable is missing is the failure
      # mode this whole job exists to avoid.
      NACRE_PG_URL: postgres://postgres:test@localhost:5432/nacre_test
      NACRE_QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      # No version here: pnpm/action-setup refuses to run when the version is
      # given both as an input and as packageManager in package.json. That
      # field is the single source of truth, and it pins an exact version.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate

      # Split by group so a leak reads as "T3 failed" in the checks list rather
      # than as one number among fifty. The selector is `-t`, an alias of
      # --testNamePattern; `--grep` is not a vitest flag and silently ran
      # everything in the version of this file that shipped first.
      #
      # Each step goes through scripts/acl-group.mjs, which fails when the
      # selector matches nothing. `vitest -t` skips what does not match and
      # exits 0, so a renamed describe block would otherwise turn a leak-test
      # step green while checking nothing.
      # First, because it is the step that keeps the rest honest. The
      # selectors below are literal, so a test whose describe block matches
      # none of them does not run here — and the job goes green, because every
      # step it did run passed. That had already happened to the coverage test
      # and to the rule 6 test.
      - name: every acl test is reachable by a selector
        run: pnpm lint:acl-groups

      - name: T1-T8 · baseline
        run: pnpm test:acl:group "baseline"
      - name: T9-T10 · result saturation
        run: pnpm test:acl:group "saturation"
      - name: truth table · docs/authz.md 3.2
        run: pnpm test:acl:group "truth table"
      - name: T11-T15 · adversarial
        run: pnpm test:acl:group "adversarial"

      # Its own step for the same reason as the rest, and it needs one: the
      # group selectors above are literal, so a file whose describe block
      # matches none of them never runs here at all. This one exercises the
      # worker pipeline and the search path against each other, which nothing
      # else does — every other test in the suite holds one end still.
      - name: round trip · the worker and the search path agree
        run: pnpm test:acl:group "pipeline round trip"

      # Both of these existed and neither ran here until the reachability check
      # above was added. The first asserts that every case docs/authz.md names
      # has a test behind it, which makes it the one that notices when the rest
      # stop being enough. The second guards rule 6 — write does not imply read
      # — the invariant a reader is most likely to mistake for a bug and fix.
      - name: coverage · every case in docs/authz.md has a test
        run: pnpm test:acl:group "test plan coverage"
      - name: rule 6 · write does not imply read
        run: pnpm test:acl:group "permission implication"

      # I5 holds only if a delete reaches the index. The Postgres tombstone
      # changes nothing a query looks at.
      - name: I5 · a deleted document leaves the index
        run: pnpm test:acl:group "I5 · the delete path"

      # `layers` on a search is the caller restricting themselves, and it is a
      # `must` on top of the permission `should` rather than a replacement for
      # it. Its own step because the failure mode is a widening: compose the two
      # wrong and a query parameter reaches a layer no grant does — I2 broken by
      # something that reads like a convenience feature.
      - name: I2 · a caller restriction only ever removes results
        run: pnpm test:acl:group "narrowing"

      # The installation-wide default embedding provider is a NULL-org_id row
      # every tenant reads and none may write. Its own step because a
      # permissive-vs-restrictive slip in the write policies is a tenant
      # repointing or deleting the model every other tenant depends on.
      - name: RLS · the installation default embedding provider is read-only to a tenant
        run: pnpm test:acl:group "embedding_providers"

      # Fast on a pull request, exhaustive at night. The nightly run is where a
      # rare interaction between deny and inheritance actually gets found.
      - name: property · resolve vs the reference implementation
        run: pnpm test:acl:property
        env:
          PROPERTY_RUNS: ${{ github.event_name == 'schedule' && '10000' || '500' }}

      # Prints on green runs too. A gap nobody sees is a gap nobody closes.
      - name: not yet covered
        run: pnpm authz:pending
