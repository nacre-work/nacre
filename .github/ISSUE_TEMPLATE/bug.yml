name: Bug report
description: Something behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠ **Found an access-control problem or a data leak?**
        Don't open an issue — see [SECURITY.md](../../SECURITY.md).
  - type: input
    attributes: { label: Nacre version }
    validations: { required: true }
  - type: dropdown
    attributes:
      label: Surface
      options: [MCP, REST API, Admin UI, Indexing worker, Deployment]
    validations: { required: true }
  - type: textarea
    attributes: { label: What happens }
    validations: { required: true }
  - type: textarea
    attributes: { label: What you expected }
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Keep it minimal. Strip secrets and document contents.
