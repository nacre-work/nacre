{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nacre.serviceAccountName" . }}
  labels: {{- include "nacre.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# Nacre calls no Kubernetes API. The token is off so a compromised pod does not
# get one for free.
automountServiceAccountToken: false
{{- end }}
