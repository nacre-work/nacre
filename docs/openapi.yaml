        from the stored row rather than from anything the caller sends.
      description: >
        A removal, not an effect flip. Writing effect 'deny' would look
        equivalent and is not: a deny beats an allow at any depth, so it would
        also suppress access the principal holds through a group or a parent
        scope, and deny is a commercial capability this build does not issue.
        The change is reflected in the next search rather than eventually: the
        caller's permitted set is computed per request from `grants`, and the
        one cache in front of it is keyed on the organization's permission
