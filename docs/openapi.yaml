            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '400': { description: "'name' is missing or empty" }
        '409': { description: 'The name is already in use in this organization' }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }
  /groups/{id}:
    delete:
      summary: Delete a group, and the grants issued to it
      description: >
        Really deleted, unlike a user: nothing references a group id the way the
        audit log references a user's, and "the team no longer exists" is a
        different statement from "this person has left".


        Grants naming the group go with it. There is no foreign key from
        `grants` — `principal_id` addresses three tables, so it is a bare uuid —
        and a grant to a principal that does not exist is a row `GET /v1/grants`
        lists and nobody can resolve. No permission answer changes either way:
        the resolver walks membership from the caller, and a deleted group has
        no members to walk from.
