    delete:
      summary: Remove a member from a group
      description: >
        The type is in the path because the edge is keyed by which member column
        it uses — a bare uuid does not identify one. The same shape `grants`
        uses for the other end of the same relationship.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: type, in: path, required: true, schema: { type: string, enum: [user, group] } }
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }
  /jobs/{id}:
    get:
      summary: Ingest job status
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Job state and progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }
  /audit:
    get:
      summary: Read the access log
      description: >
        Every access is recorded — see docs/audit.md — and this is how it is read
        back. Newest first, cursor-paged, and available as JSON, JSONL or CSV by
        content negotiation rather than a `format` parameter: the difference
        between them is representation, not resource.


        **Two roles see two different logs.** `org_admin` administers the tenant
        and sees its log in full, including which documents were read — the
        question docs/audit.md opens with. `platform_admin` administers the
        installation and is shown administrative actions only, never the record
        of who read what. That is rule 2 in authz.md applied to the journal: a
        platform administrator able to read every tenant's document-access log
        has exactly the access the permission model exists to deny, obtained
        through the record that exists to prove they did not have it. It is not a
        request parameter, so a caller cannot widen their own view by omitting
        one.


        Reading the log is itself recorded, as `audit.read`.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
          description: Inclusive lower bound on `occurred_at`.
        - name: to
          in: query
          schema: { type: string, format: date-time }
          description: >
            Exclusive upper bound. A range with `from` at or after `to` is
            refused rather than returning nothing — on a compliance query "no
            events happened" and "you asked for an impossible range" are
            opposite answers.
        - name: actor_id
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string, maxLength: 64 }
        - name: result
          in: query
          schema: { type: string, enum: [allow, deny, error] }
      responses:
        '200':
          description: >
            Events, newest first. JSON carries `next_cursor` in the body; JSONL
            and CSV carry it in a `Link: rel="next"` header, because an export
            streaming to a file has nowhere to put a footer.
          headers:
            Link:
              schema: { type: string }
              description: 'Present on JSONL and CSV when more events follow.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
                  next_cursor: { type: [string, 'null'] }
            application/x-ndjson:
              schema: { type: string, description: 'One AuditEvent per line.' }
            text/csv:
              schema: { type: string, description: 'RFC 4180, CRLF, with a header row.' }
        '400':
          description: A malformed filter, refused rather than dropped.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: >
            Not 403, which an earlier draft of this document published and which
            would have been the only 403 in the contract. Invariant 4 reserves
            403 for an operation forbidden on an object the caller can already
            see; whether an organization has an audit log is not something a
            caller who may not read it is told. A method other than GET answers
            the same way.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '406':
          description: An Accept header naming none of the three types served.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /health:
    get:
      summary: Liveness. Touches no dependency.
      description: >
        `200` whenever the process is running. It calls neither Postgres, Qdrant
        nor Redis, deliberately: a liveness check that queried a dependency would
        turn one slow database into a cascading restart loop, which is the
        failure a liveness probe exists to avoid rather than cause. Point a
        Kubernetes `livenessProbe` here; the chart does.
      security: []
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /ready:
    get:
      summary: Readiness. Touches everything a request needs.
      description: >
        The opposite of liveness: it checks Postgres, Qdrant, Redis and object
        storage — everything this process cannot serve a request without — and
        answers `503` until all of them are reachable. An orchestrator reads the
        status code and holds traffic off a replica whose dependencies are not
        up yet. Unauthenticated, because a probe has no credential to present,
        and the body names which dependency is unhappy and never why. Point a
        Kubernetes `readinessProbe` here.


        `schema` is in there too and is not a dependency: it is `false` while
        the database is behind the migrations this build ships, so a replica
        started before the migrator has run never enters rotation instead of
        reporting ready and failing every request. A database that is *ahead*
        is `true` — that is the middle of a rolling upgrade. Which migration is
        missing goes to the log and never into this body.


        The embedder is deliberately **not** checked. It is an endpoint the
        operator supplies, a search fails loudly without it, and making
        readiness depend on somebody else's uptime turns their outage into a
        rollout that never completes.
      security: []
      responses:
        '200':
          description: Every dependency is reachable.
          content:
            application/json:
              schema:
                type: object
                required: [status, checks]
                properties:
                  status: { type: string, enum: [ready] }
                  checks:
                    type: object
                    additionalProperties: { type: boolean }
        '503':
          description: At least one dependency is not reachable; `checks` says which.
          content:
            application/json:
              schema:
                type: object
                required: [status, checks]
                properties:
                  status: { type: string, enum: ['not ready'] }
                  checks:
                    type: object
                    additionalProperties: { type: boolean }
  /metrics:
    # At the origin, which the description below has always said and the base
    # never reflected: under the global /v1 server this reads as /v1/metrics,
    # where the authenticated surface answers 401 to a scraper.
    servers:
      - url: https://nacre.work
    get:
      summary: Prometheus exposition. Scraped, not called.
      description: >
        The metrics `docs/config.md` names, in Prometheus text format, served at
        the root rather than under `/v1` because that is where a scraper expects
        them. Open by default; set `NACRE_METRICS_TOKEN` and it requires that
        bearer, answering `404` — not `401` — to a request without it, so an
        unauthenticated scrape of a hardened deployment reveals not even that the
        endpoint exists. The MCP transport serves its own `nacre_mcp_*` metrics
        on its own port; this is the API's.
      security: []
      responses:
        '200':
          description: The exposition.
          content:
            text/plain:
              schema: { type: string }
        '404':
          description: >
            `NACRE_METRICS_TOKEN` is set and the request did not present it —
            deliberately indistinguishable from an unconfigured endpoint.
