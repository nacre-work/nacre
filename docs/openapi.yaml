        Direct only. A nested group is one member, not its members: flattening
        here would answer a different question from the one the row holds, and
        the transitive closure is the resolver's and is computed per request.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/GroupMember' } }
                  next_cursor: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }
    post:
      summary: Add a user or a nested group
      description: >
        `204` whether the member was added or was already there. The request
        asked for a state and that state holds either way, and distinguishing
        them would report whether somebody is in a group — a fact about the
        group rather than about this request.


        A cycle is not refused. `group_members` says so in its own comment:
        cycles are the resolver's problem to terminate on rather than the
        schema's to prevent, `effectivePrincipals` walks into a set, and T14 in
        docs/authz.md is what pins that.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, id]
              properties:
                type: { type: string, enum: [user, group] }
