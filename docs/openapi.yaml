        '403':
          description: >
            The target holds `platform_admin`. That role administers the
            installation rather than this organization, so it is not issued,
            revoked, disabled or reset through an endpoint scoped to one — in
            either direction. `POST /v1/users` has always refused to *set* it
            here for the same reason.


            Deliberately not a 404: `GET /v1/users` lists this person with their
            role, so the caller is looking straight at the row and there is
            nothing invisible for invariant 4 to protect. Not a 409 either — the
            last-administrator refusal beside it goes away once there is a
            second administrator, and this one never does.
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }
  /groups:
    get:
      summary: Groups in the organization. Requires org_admin.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Group' } }
                  next_cursor: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }
    post:
      summary: Create a group
      description: >
        A group is what makes a grant survive staff turnover: grant the group
        once, and joining the team is a membership change rather than a new
        grant nobody remembers to revoke.
