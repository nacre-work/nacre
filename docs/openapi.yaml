        '204': { description: Disabled }
        '409': { description: 'This is the only active org_admin — promote another first' }
        '403':
          description: >
            The target holds `platform_admin`. That role administers the
            installation rather than this organization, so it is not issued,
            revoked, disabled or reset through an endpoint scoped to one — in
            either direction. `POST /v1/users` has always refused to *set* it
            here for the same reason.


            Deliberately not a 404: `GET /v1/users` lists this person with their
